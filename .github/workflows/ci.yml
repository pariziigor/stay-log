name: CI — Testes Automatizados & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    name: Backend (FastAPI + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Executar suíte Pytest (Unitários, Integração, Segurança e Concorrência)
        run: pytest -v

  frontend-tests-and-build:
    name: Frontend (React + TypeScript + Vitest + Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes unitários (Vitest)
        run: npm test
      - name: Validar tipagem TypeScript e Build de Produção
        run: npm run build

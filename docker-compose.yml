services:
  db:
    image: postgres:16-alpine
    container_name: locacao-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locacao}
      POSTGRES_USER: ${POSTGRES_USER:-locacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: locacao-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY com 32+ caracteres no arquivo .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-locacao}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-locacao}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: locacao-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
